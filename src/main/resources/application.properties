# Application Settings
spring.application.name=gateway
server.port=8081

# JWT Configuration Settings
# Reads from environment variable JWT_SECRET if available
pulseengine.app.jwtSecret=${JWT_SECRET:your_default_local_secret_key_change_in_production}
pulseengine.app.jwtExpirationMs=86400000

# Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/pulse_engine_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_local_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Automatic Database Initialization
spring.sql.init.mode=always